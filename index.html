<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Limpieza Mística: Recolector de Luz 🌿✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle at center, #1a1c2e 0%, #0d0e15 100%);
            color: #e0e6ed;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }
        header {
            text-align: center;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.5rem;
            color: #f6ad55;
            text-shadow: 0 0 12px rgba(246, 173, 85, 0.6);
            letter-spacing: 0.5px;
        }
        p.subtitle {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-top: 2px;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        #score-board {
            display: flex;
            justify-content: space-between;
            width: 320px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        canvas {
            background: #101420;
            border: 2px solid #4299e1;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(66, 153, 225, 0.25);
            touch-action: none;
        }
        /* Controles Táctiles para Móviles */
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 220px;
            margin-top: 14px;
        }
        .btn-ctrl {
            background: linear-gradient(145deg, #2d3748, #1a202c);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            font-size: 1.4rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            touch-action: manipulation;
            transition: transform 0.05s ease, background 0.2s ease;
        }
        .btn-ctrl:active {
            background: #4a5568;
            transform: scale(0.92);
        }
        #up { grid-column: 2; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }

        /* Pantalla de Mensaje Modal */
        #modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.92);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }
        #modal h2 {
            color: #63b3ed;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }
        #modal p {
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e0;
        }
        #modal button {
            background: linear-gradient(135deg, #ecc94b 0%, #d69e2e 100%);
            color: #1a202c;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(214, 158, 46, 0.4);
            transition: transform 0.2s ease;
        }
        #modal button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>Limpieza Mística 🌟</h1>
        <p class="subtitle">Recolecta la luz y disipa el ruido mental</p>
    </header>

    <div id="game-container">
        <div id="score-board">
            <span>Puntos: <span id="score">0</span></span>
            <span>Estado: <span id="status" style="color: #63b3ed;">En Calma</span></span>
        </div>

        <canvas id="canvas" width="320" height="320"></canvas>

        <div id="controls">
            <button class="btn-ctrl" id="up">⬆️</button>
            <button class="btn-ctrl" id="left">⬅️</button>
            <button class="btn-ctrl" id="down">⬇️</button>
            <button class="btn-ctrl" id="right">➡️</button>
        </div>

        <div id="modal">
            <h2 id="modal-title">¿Lista para volver a tu centro?</h2>
            <p id="modal-msg">Recoge todas las estrellas de luz. Si te cruzas con un pensamiento pesado, usa las Esferas de Anclaje 🔮 para disiparlo.</p>
            <button id="start-btn">Comenzar</button>
        </div>
    </div>
